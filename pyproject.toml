[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "criterialogic"
version = "0.2.0"
description = "A depth-parameterised stress test for logical reasoning over clinical-trial eligibility criteria."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Martin Arogyasami" }]
keywords = ["clinical trials", "eligibility criteria", "benchmark", "LLM",
            "logical reasoning", "clinical NLP", "calibration"]
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
criterialogic-eval = "criterialogic.cli:main"

[project.urls]
Homepage = "https://github.com/darogyasami/criterialogic"

[tool.setuptools]
packages = ["criterialogic", "criterialogic.schema", "criterialogic.data",
            "criterialogic.data.loaders", "criterialogic.tasks", "criterialogic.models",
            "criterialogic.metrics", "criterialogic.taxonomy", "criterialogic.eval",
            "criterialogic.leaderboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Stable, version-independent baseline. E501 (line length) is not enforced so that
# example command lines in docstrings stay on one line and copy-pasteable.
select = ["E", "F", "I", "W"]
ignore = ["E501"]
